<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exoplanet Archive | Grupo 08</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #07111f;
      color: #e8f0ff;
    }

    body {
      max-width: 1100px;
      margin: auto;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      align-items: end;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
    }

    .subtle {
      color: #a8bbd6;
    }

    select {
      padding: .65rem;
      border: 1px solid #34506f;
      border-radius: .45rem;
      background: #10233d;
      color: inherit;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .card {
      padding: 1rem;
      border-radius: .7rem;
      background: #10233d;
    }

    .number {
      color: #72d6ff;
      font-size: 1.7rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0d1b2d;
    }

    th,
    td {
      padding: .7rem;
      border-bottom: 1px solid #263e5b;
      text-align: left;
    }

    th {
      color: #9edfff;
    }

    #status {
      min-height: 1.4rem;
    }

    #status.error {
      color: #ffafaf;
    }

    @media (max-width: 650px) {
      body {
        padding: 1rem;
      }

      table {
        font-size: .8rem;
      }

      .hide-small {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Exoplanet Archive</h1>
      <p class="subtle">Dados de exoplanetas confirmados pela NASA - Grupo 08</p>
    </div>
    <label>Método de descoberta<br><select id="filter">
        <option value="">Todos</option>
      </select></label>
  </header>
  <p id="status">Carregando dados...</p>
  <section class="cards">
    <div class="card">Exoplanetas exibidos<div class="number" id="total">-</div>
    </div>
    <div class="card">Métodos distintos<div class="number" id="methods">-</div>
    </div>
    <div class="card">Última atualização<div class="number" id="updated">-</div>
    </div>
  </section>
  <table>
    <thead>
      <tr>
        <th>Planeta</th>
        <th>Estrela</th>
        <th>Método</th>
        <th class="hide-small">Ano</th>
        <th class="hide-small">Período (dias)</th>
        <th>Raio (Terra)</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="config.js"></script>
  <script>
    const {url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY} = window.SUPABASE_CONFIG || {};
    const rows = document.querySelector('#rows');
    const status = document.querySelector('#status');
    const filter = document.querySelector('#filter');
    let data = [];

    function escapeHtml(value) {
      const entities = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      };
      return String(value ?? '').replace(/[&<>'"]/g, char => entities[char]);
    }

    function show() {
      const visible = filter.value ? data.filter(item => item.discovery_method === filter.value) : data;
      document.querySelector('#total').textContent = visible.length.toLocaleString('pt-BR');
      rows.innerHTML = visible.slice(0, 200).map(item => `
        <tr><td>${escapeHtml(item.pl_name)}</td><td>${escapeHtml(item.hostname)}</td><td>${escapeHtml(item.discovery_method)}</td><td class="hide-small">${escapeHtml(item.discovery_year)}</td><td class="hide-small">${escapeHtml(item.orbital_period_days)}</td><td>${escapeHtml(item.planet_radius_earth)}</td></tr>
      `).join('');
    }

    async function load() {
      try {
        if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes('COLE_AQUI') || SUPABASE_ANON_KEY.includes('COLE_AQUI')) {
          throw new Error('Configure SUPABASE_URL e SUPABASE_ANON_KEY nas Variables do GitHub e publique pelo workflow. Para teste local, preencha config.js com a URL e a chave publishable/anon.');
        }
        if (!/^https:\/\/[^/]+\.supabase\.co\/?$/.test(SUPABASE_URL)) {
          throw new Error('SUPABASE_URL inválida. Use o formato https://seu-projeto.supabase.co, sem /rest/v1.');
        }
        const headers = {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        };
        const [planetsResponse, runsResponse] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/exoplanetas?select=pl_name,hostname,discovery_method,discovery_year,orbital_period_days,planet_radius_earth&order=pl_name.asc`, {headers}),
          fetch(`${SUPABASE_URL}/rest/v1/execucoes?select=finished_at,status&status=eq.concluido&order=finished_at.desc&limit=1`, {headers}),
        ]);
        if (!planetsResponse.ok || !runsResponse.ok) {
          const response = !planetsResponse.ok ? planetsResponse : runsResponse;
          const endpoint = !planetsResponse.ok ? 'exoplanetas' : 'execucoes';
          let detail = '';
          try {
            const body = await response.json();
            detail = body.message || body.hint || body.details || '';
          } catch (_) {
          }
          throw new Error(`A API REST recusou a consulta a ${endpoint} (HTTP ${response.status})${detail ? `: ${detail}` : ''}.`);
        }
        data = await planetsResponse.json();
        const methods = [...new Set(data.map(item => item.discovery_method).filter(Boolean))].sort();
        filter.innerHTML += methods.map(item => `<option>${escapeHtml(item)}</option>`).join('');
        document.querySelector('#methods').textContent = methods.length;
        const latest = (await runsResponse.json())[0];
        document.querySelector('#updated').textContent = latest ? new Date(latest.finished_at).toLocaleDateString('pt-BR') : 'sem execução';
        status.textContent = data.length > 200 ? 'Mostrando os primeiros 200 resultados do filtro.' : '';
        show();
      } catch (error) {
        status.textContent = error.message;
        status.className = 'error';
      }
    }

    filter.addEventListener('change', show);
    load();
  </script>
</body>

</html>
