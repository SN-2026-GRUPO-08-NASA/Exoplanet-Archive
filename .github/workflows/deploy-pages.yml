name: Publicar painel

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Gerar configuração pública do painel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          printf '%s\n' "window.SUPABASE_CONFIG = {" > config.js
          printf '  url: %s,\n' "$(jq -Rn --arg value "$SUPABASE_URL" '$value')" >> config.js
          printf '  anonKey: %s,\n' "$(jq -Rn --arg value "$SUPABASE_ANON_KEY" '$value')" >> config.js
          printf '%s\n' '};' >> config.js

      - name: Preparar artefato do Pages
        run: |
          mkdir site
          cp index.html config.js site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
