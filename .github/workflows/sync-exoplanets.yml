
name: Sincronização de Exoplanetas

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync:
    name: Atualizar banco de exoplanetas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivo
        run: |
          if [ ! -f "./scripts/sync_exoplanets.py" ]; then
            echo "Erro: sync_exoplanets.py não encontrado na pasta scripts."
            echo "Arquivos disponíveis:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Script encontrado com sucesso!"

      - name: Validar Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Erro: SUPABASE_URL não configurada."
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Erro: SUPABASE_SERVICE_KEY não configurada."
            exit 1
          fi

          echo "Secrets configuradas com sucesso!"

      - name: Executar sincronização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python "./scripts/sync_exoplanets.py"
