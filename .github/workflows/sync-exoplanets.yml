
name: Sincronização de Exoplanetas

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync:
    name: Atualizar banco de exoplanetas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivo
        run: |
          if [ ! -f "./scripts/sync_exoplanets.py" ]; then
            echo "Erro: script não encontrado!"
            exit 1
          fi

          echo "Script encontrado!"

      - name: Validar configurações
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Erro: SUPABASE_URL não encontrada nas Variables."
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Erro: SUPABASE_SERVICE_KEY não encontrada nos Secrets."
            exit 1
          fi

          echo "Credenciais configuradas corretamente!"

      - name: Executar sincronização
        run: python "./scripts/sync_exoplanets.py"
