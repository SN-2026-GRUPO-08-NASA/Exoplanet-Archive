
name: Sincronização de Exoplanetas

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync:
    name: Atualizar banco de exoplanetas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Localizar script
        id: script
        run: |
          SCRIPT=$(find . -type f -name "sync_exoplanets.py" -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "Script sync_exoplanets.py não encontrado!"
            exit 1
          fi

          echo "path=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "Script encontrado: $SCRIPT"

      - name: Executar sincronização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python "${{ steps.script.outputs.path }}"
